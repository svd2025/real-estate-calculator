<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Customer Database & Live Call Log</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      padding: 20px;
    }

    /* Main Card Container */
    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header Styling */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title {
      color: #1a73e8;
      font-size: 20px;
      font-weight: bold;
      margin: 0;
    }

    .legend-container {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f1f3f4;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .legend-box {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    /* Search Box */
    .search-section {
      margin-bottom: 15px;
    }

    .search-label {
      display: block;
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 5px;
    }

    .search-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #1a73e8;
    }

    /* ========================================================= */
    /* TABLE CONTAINER - FIXES BOTH SCROLLBARS IN PLACE          */
    /* ========================================================= */
    .table-container {
      max-height: 480px;            /* Limits vertical height */
      overflow-x: auto;             /* Always displays bottom horizontal scrollbar inside box */
      overflow-y: auto;             /* Allows smooth vertical scrolling inside box */
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 15px;
      background-color: #ffffff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;             /* Forces scrollbar when screen is narrower than columns */
      text-align: left;
    }

    /* Sticky Header - Keeps table headers visible while scrolling down */
    thead th {
      position: sticky;
      top: 0;
      background-color: #e8f0fe;
      color: #1a73e8;
      font-size: 13px;
      font-weight: bold;
      padding: 12px 10px;
      border-bottom: 2px solid #aecbfa;
      white-space: nowrap;
      z-index: 2;
    }

    tbody td {
      padding: 10px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 13px;
      color: #3c4043;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    tbody tr:hover {
      background-color: #f1f3f4;
    }

    /* Buttons & Badges */
    .status-btn {
      background: #ffffff;
      border: 1px solid #dadce0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #3c4043;
    }

    .status-btn:hover {
      background: #f1f3f4;
    }

    .export-btn {
      width: 100%;
      background-color: #34a853;
      color: white;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .export-btn:hover {
      background-color: #2d9247;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header Title and Legends -->
    <div class="card-header">
      <h2 class="card-title">Past Customer Database & Live Call Log</h2>
      <div class="legend-container">
        <div class="legend-item">
          <span class="legend-box" style="background: #80868b;"></span> Grey - Normal Flat
        </div>
        <div class="legend-item">
          <span class="legend-box" style="background: #1a73e8;"></span> Blue - Flat with Extra Balcony
        </div>
        <div class="legend-item">
          <span class="legend-box" style="background: #f9ab00;"></span> Orange - Pent House
        </div>
      </div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <label class="search-label">Search Lead (by Name, Mobile, Gaam, Type, Status, Date, Broker)</label>
      <input type="text" id="searchInput" class="search-input" placeholder="Type to search..." onkeyup="filterTable()">
    </div>

    <!-- Scrollable Table Wrapper -->
    <div class="table-container">
      <table id="leadsTable">
        <thead>
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Type</th>
            <th>Business</th>
            <th>Mo No</th>
            <th>Gaam</th>
            <th>Taluka</th>
            <th>District</th>
            <th>Live Status Update</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Data populated dynamically via Web App API -->
        </tbody>
      </table>
    </div>

    <!-- Action Buttons -->
    <button class="export-btn" onclick="exportToCSV()">Export to CSV / Excel</button>
  </div>

  <script>
    // URL to your Google Apps Script Web App Endpoint
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbweATmPUGlMBdqgJ03tyIylJQb-CcdPPxw-reM5LdeI18cnnf0639-ODlmdD6bWvJlTEQ/exec";

    // Fetch leads on page load
    document.addEventListener("DOMContentLoaded", fetchLeads);

    function fetchLeads() {
      fetch(WEB_APP_URL)
        .then(response => response.json())
        .then(data => {
          if(data.error) {
            console.error("Error from script:", data.error);
            return;
          }
          renderTable(data);
        })
        .catch(err => console.error("Error fetching data:", err));
    }

    function renderTable(leads) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      leads.forEach(lead => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${lead.firstName || '-'}</td>
          <td>${lead.lastName || '-'}</td>
          <td>${lead.partyType || '-'}</td>
          <td>${lead.business || '-'}</td>
          <td>${lead.moNo || '-'}</td>
          <td>${lead.gaam || '-'}</td>
          <td>${lead.taluka || '-'}</td>
          <td>${lead.district || '-'}</td>
          <td><button class="status-btn">Brochure Sent</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Client-side Filter Search
    function filterTable() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#tableBody tr");

      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
      });
    }

    // CSV Export Handler
    function exportToCSV() {
      const table = document.getElementById("leadsTable");
      let csv = [];
      for (let i = 0; i < table.rows.length; i++) {
        let row = [], cols = table.rows[i].querySelectorAll("td, th");
        for (let j = 0; j < cols.length - 1; j++) { // Exclude action column
          row.push('"' + cols[j].innerText.replace(/"/g, '""') + '"');
        }
        csv.push(row.join(","));
      }
      
      const csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
      const downloadLink = document.createElement("a");
      downloadLink.download = "Leads_Database.csv";
      downloadLink.href = window.URL.createObjectURL(csvFile);
      downloadLink.click();
    }
  </script>
</body>
</html>
